; PlatformIO project configuration
[platformio]
default_envs = cardputer

[env:cardputer]
; Arduino core 3.2.0 (ESP-IDF 5.4.1). Do NOT use newer cores: on ESP-IDF 5.5
; (core 3.3.x) the Cardputer ADV microphone returns only constant samples.
; See espressif/esp-idf#18621 and the audio-spy project README.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Cardputer@1.1.1     ; display, keyboard, microphone (ADV: ES8311 codec)

; M5StickS3: the same firmware with two buttons instead of the keyboard; the
; Recorder keeps 8 kHz recordings in the flash memory (no SD card), no Mic
; test: pio run -e sticks3. Same core 3.2.0.
[env:sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.arduino.memory_type = qio_opi     ; 8 MB octal PSRAM in the ESP32-S3-PICO-1
board_build.partitions = partitions_sticks3.csv  ; ~5.4 MB for recordings
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM -DBOARD_STICKS3
lib_deps =
  m5stack/M5Unified@0.2.23      ; display, buttons, microphone (ES8311 codec)

; Unit tests of the DSP library on the PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall

; Cardenza: original matrix/PDM microphone, ES8156 DAC, no power ADC/RGB.
[env:cardenza]
extends = env:cardputer
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    ${env:cardputer.build_flags}
    -DARDUINO_USB_MODE=1
    -DCARDENZA_TARGET
    -Wl,--wrap=esp_partition_erase_range
    -Wl,--wrap=_ZN2m511Power_Class5beginEv
    -Wl,--wrap=_ZN2m59M5Unified10_setup_ledEN4lgfx6boards7board_tE
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.31
